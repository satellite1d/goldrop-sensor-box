[platformio]
src_dir = main
default_envs = goldrop

[env:goldrop]
; Goldrop PCB: ESP32-C3-WROOM-02-N4, native USB Serial/JTAG on GPIO18/19.
platform = platformio/espressif32@7.1.3
board = goldrop_c3
framework = espidf
extra_scripts = pre:tools/pio_configure.py
board_build.partitions = partitions.csv
monitor_speed = 115200
